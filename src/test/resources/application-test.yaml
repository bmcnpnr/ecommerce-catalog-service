# Profile "test" — for full-context tests (@SpringBootTest + @ActiveProfiles("test")).
# The repository slice test does not use it: its MongoDB comes from a
# Testcontainers @ServiceConnection, which overrides spring.mongodb.* entirely.
spring:
  mongodb:
    host: ${SPRING_MONGODB_HOST:localhost}
    port: ${SPRING_MONGODB_PORT:27017}
    database: catalogdb-test

eureka:
  client:
    enabled: false
