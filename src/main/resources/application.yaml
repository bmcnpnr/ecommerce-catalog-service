server:
  port: 8083

spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
      # Without eager-load, the ServiceInstanceListSupplier for a Feign client is
      # built lazily on first use and starts empty, so the very first call to a
      # peer fails with "Load balancer does not contain an instance".
      eager-load:
        clients: product-service
    openfeign:
      client:
        config:
          default:
            # Fail fast on a peer that vanished mid-rollout (default connect
            # timeout is 10s) so the connection-failure retry in FeignConfig can
            # move on to the next instance; reads stay generous.
            connect-timeout: 2000
            read-timeout: 10000
  application:
    name: catalog-service
  # Storage is MongoDB, not Postgres: a catalog entry is a denormalised read
  # model of one product (no joins, no cross-document invariants), and every
  # query is a single-collection lookup by product id, category, featured flag
  # or name. The env var names deliberately mirror the other services:
  # DB_USERNAME / DB_PASSWORD carry the credentials and SPRING_MONGODB_HOST the
  # address, the way SPRING_DATASOURCE_URL does for the JPA services. Setting
  # SPRING_MONGODB_URI overrides all of these (Boot ignores host/port/credentials
  # when a uri is present). Spring Boot 4 moved these keys from
  # spring.data.mongodb.* to spring.mongodb.*; the old names still bind but log
  # a deprecation warning.
  mongodb:
    host: ${SPRING_MONGODB_HOST:localhost}
    port: ${SPRING_MONGODB_PORT:27017}
    database: ${SPRING_MONGODB_DATABASE:catalogdb}
    username: ${DB_USERNAME:cataloguser}
    password: ${DB_PASSWORD:catalogpass}
    # The container's MONGO_INITDB_ROOT_* user is created in the admin database.
    authentication-database: admin
  data:
    mongodb:
      # Spring Data's historical default stores BigDecimal as a *string*, which
      # sorts lexically and defeats range queries on price. Decimal128 is the
      # exact numeric type; it round-trips DECIMAL(19,2) values losslessly.
      representation:
        big-decimal: decimal128
      # Indexes are created explicitly by CatalogCollectionInitializer (the role the
      # Flyway migration used to play) rather than on mapping-context startup.
      auto-index-creation: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    # Fetch the registry every 5s (default 30s) so a replaced peer is seen
    # quickly. The LoadBalancer's own instance cache is shortened to match
    # (spring.cloud.loadbalancer.cache.ttl) where this service calls peers.
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    # Heartbeat every 5s, expire after 15s (defaults 30s / 90s): a *crashed*
    # instance leaves the registry within ~20s instead of up to two minutes.
    # Graceful stops do not wait for this: the Kubernetes preStop hook marks
    # the instance OUT_OF_SERVICE through /actuator/serviceregistry and drains
    # for 15s, then Boot's graceful shutdown deregisters it — see
    # ecommerce-platform/k8s/40-services.yaml.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,serviceregistry
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:development}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    instances:
      product-service:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] [%thread] %-5level %logger{36} - %msg%n"
