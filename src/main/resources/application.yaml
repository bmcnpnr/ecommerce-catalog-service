server:
  port: 8083

spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
      # Without eager-load, the ServiceInstanceListSupplier for a Feign client is
      # built lazily on first use and starts empty, so the very first call to a
      # peer fails with "Load balancer does not contain an instance".
      eager-load:
        clients: product-service
    # Spring Cloud CircuitBreaker, left on its defaults, hands every call to a worker thread behind a time limiter
    # (1 s, which silently cuts every slower call) and a bulkhead thread pool of one thread per CPU with a
    # 100-call queue (two concurrent calls in a 2-CPU container, the rest rejected). All three are off: the call
    # runs on the calling thread, Feign's connect and read timeouts below govern, and the breaker only counts.
    circuitbreaker:
      resilience4j:
        disable-thread-pool: true
        disable-time-limiter: true
      bulkhead:
        resilience4j:
          enabled: false
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            # Fail fast on a peer that vanished mid-rollout (default connect
            # timeout is 10s) so the connection-failure retry in FeignConfig can
            # move on to the next instance; reads stay generous.
            connect-timeout: 2000
            read-timeout: 10000
  application:
    name: catalog-service
  # Storage is MongoDB, not Postgres: a catalog entry is a denormalised read
  # model of one product (no joins, no cross-document invariants), and every
  # query is a single-collection lookup by product id, category, featured flag
  # or name. The env var names deliberately mirror the other services:
  # DB_USERNAME / DB_PASSWORD carry the credentials and SPRING_MONGODB_HOST the
  # address, the way SPRING_DATASOURCE_URL does for the JPA services. Setting
  # SPRING_MONGODB_URI overrides all of these (Boot ignores host/port/credentials
  # when a uri is present). Spring Boot 4 moved these keys from
  # spring.data.mongodb.* to spring.mongodb.*; the old names still bind but log
  # a deprecation warning.
  mongodb:
    host: ${SPRING_MONGODB_HOST:localhost}
    port: ${SPRING_MONGODB_PORT:27017}
    database: ${SPRING_MONGODB_DATABASE:catalogdb}
    username: ${DB_USERNAME:cataloguser}
    password: ${DB_PASSWORD:catalogpass}
    # The container's MONGO_INITDB_ROOT_* user is created in the admin database.
    authentication-database: admin
  data:
    mongodb:
      # Spring Data's historical default stores BigDecimal as a *string*, which
      # sorts lexically and defeats range queries on price. Decimal128 is the
      # exact numeric type; it round-trips DECIMAL(19,2) values losslessly.
      representation:
        big-decimal: decimal128
      # Indexes are created explicitly by CatalogCollectionInitializer (the role the
      # Flyway migration used to play) rather than on mapping-context startup.
      auto-index-creation: false

# MongoDB client timeouts (MongoConfig.mongoClientTimeouts, D4). The driver's own defaults are a 30s server
# selection (every request hangs through an outage), no socket timeouts and a 2 minute pool wait.
catalog:
  mongo:
    server-selection-timeout: 3s
    connect-timeout: 2s
    socket-timeout: 5s
    pool-wait-timeout: 2s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    # Fetch the registry every 5s (default 30s) so a replaced peer is seen
    # quickly. The LoadBalancer's own instance cache is shortened to match
    # (spring.cloud.loadbalancer.cache.ttl) where this service calls peers.
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    # Heartbeat every 5s, expire after 15s (defaults 30s / 90s): a *crashed*
    # instance leaves the registry within ~20s instead of up to two minutes.
    # Graceful stops do not wait for this: the Kubernetes preStop hook marks
    # the instance OUT_OF_SERVICE through /actuator/serviceregistry and drains
    # for 15s, then Boot's graceful shutdown deregisters it — see
    # ecommerce-platform/k8s/40-services.yaml.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,serviceregistry
  endpoint:
    health:
      show-details: never
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:development}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    instances:
      # The Feign client's breaker is named after the client (FeignConfig.circuitBreakerNameResolver).
      product-service:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        # A product-service that answers, but slowly, still holds a request thread per call for up to the read
        # timeout (10 s). Calls over 5 s count as slow, and when 80 % of the window is slow the breaker opens
        # and the rest fail fast instead of piling up behind it.
        slowCallDurationThreshold: 5s
        slowCallRateThreshold: 80
        # Without this the breaker leaves OPEN only when a call is attempted, so an idle service stays
        # "open" in the metrics (and in the CircuitBreakerOpen alert) indefinitely.
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # A 4xx means the request was wrong or the thing does not exist: product-service is healthy.
        # Counting those would let a few syncs of unknown product ids trip the breaker for everyone.
        ignoreExceptions:
          - feign.FeignException$BadRequest
          - feign.FeignException$Unauthorized
          - feign.FeignException$Forbidden
          - feign.FeignException$NotFound
          - feign.FeignException$MethodNotAllowed
          - feign.FeignException$NotAcceptable
          - feign.FeignException$Conflict
          - feign.FeignException$Gone
          - feign.FeignException$UnsupportedMediaType
          - feign.FeignException$UnprocessableEntity

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId:-}] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
  level:
    # INFO by default; LOGGING_LEVEL_COM_ECOMMERCE=DEBUG turns debug on for a diagnosis.
    com.ecommerce: INFO
    # While MongoDB is unreachable the driver logs one INFO line for every operation that waits for a server (600+
    # characters: the whole topology) and a stack trace for every failed heartbeat, i.e. a line per request for as long
    # as the outage lasts. The service's own throttled WARN, the health check and the mongodb_exporter alerts say it.
    org.mongodb.driver: WARN
